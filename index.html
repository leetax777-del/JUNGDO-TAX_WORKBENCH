<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세무회계 정도 - 업무 워크벤치</title>
<style>
  @font-face {
    font-family: 'Pretendard';
    src: local('Pretendard');
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #16294f;
    --navy-light: #1f3a6e;
    --accent: #2d5ac4;
    --accent-light: #eaf0fb;
    --bg: #f4f5f7;
    --surface: #ffffff;
    --border: #e3e5ea;
    --text-primary: #1a1d24;
    --text-secondary: #6b7280;
    --text-muted: #9ca3af;
    --green-bg: #eaf6ec;
    --green-text: #1e7a34;
    --radius: 10px;
  }
  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    line-height: 1.5;
  }
  .app { display: flex; min-height: 100vh; }

  /* 사이드바 */
  .sidebar {
    width: 260px;
    background: var(--navy);
    color: #fff;
    flex-shrink: 0;
    padding: 24px 0;
    display: flex;
    flex-direction: column;
  }
  .sidebar-logo {
    padding: 20px 24px 24px;
    background: #ffffff;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    margin-bottom: 16px;
  }
  .sidebar-logo img { height: 32px; display: block; }
  .nav-section { padding: 0 12px; margin-bottom: 4px; }
  .nav-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 14px;
    border-radius: 8px;
    color: rgba(255,255,255,0.78);
    font-size: 14px;
    cursor: pointer;
    margin-bottom: 2px;
    transition: background 0.12s, color 0.12s;
  }
  .nav-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .nav-item.active { background: var(--accent); color: #fff; font-weight: 500; }
  .nav-item .label { display: flex; align-items: center; gap: 10px; }
  .nav-item .count {
    font-size: 11px;
    background: rgba(255,255,255,0.15);
    padding: 1px 7px;
    border-radius: 99px;
    color: rgba(255,255,255,0.85);
  }
  .nav-item.active .count { background: rgba(255,255,255,0.25); color: #fff; }
  .sidebar-footer {
    margin-top: auto;
    padding: 16px 24px 0;
    font-size: 11px;
    color: rgba(255,255,255,0.35);
    border-top: 1px solid rgba(255,255,255,0.1);
  }

  /* 메인 영역 */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .topbar h1 { font-size: 18px; font-weight: 500; }
  .topbar .breadcrumb { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .content { flex: 1; padding: 32px; overflow-y: auto; }

  /* 카드 그리드 (도구 목록) */
  .tool-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
  }
  .tool-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    cursor: pointer;
    transition: border-color 0.12s, box-shadow 0.12s;
  }
  .tool-card:hover { border-color: var(--accent); box-shadow: 0 2px 10px rgba(45,90,196,0.08); }
  .tool-card .icon-badge {
    width: 38px; height: 38px;
    background: var(--accent-light);
    color: var(--accent);
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    margin-bottom: 14px;
  }
  .tool-card h3 { font-size: 15px; font-weight: 500; margin-bottom: 6px; }
  .tool-card p { font-size: 13px; color: var(--text-secondary); }
  .tool-card .tag {
    display: inline-block;
    margin-top: 12px;
    font-size: 11px;
    color: var(--text-muted);
    background: var(--bg);
    padding: 3px 9px;
    border-radius: 99px;
  }

  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-muted);
  }
  .empty-state .icon { font-size: 36px; margin-bottom: 12px; opacity: 0.4; }
  .empty-state h3 { font-size: 15px; color: var(--text-secondary); margin-bottom: 4px; font-weight: 500; }
  .empty-state p { font-size: 13px; }

  /* 도구 상세 화면 공통 */
  .tool-detail { max-width: 920px; }
  .back-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--text-secondary);
    cursor: pointer; margin-bottom: 18px;
    border: none; background: none; padding: 0;
  }
  .back-btn:hover { color: var(--accent); }

  /* 계산기 스타일 */
  .calc-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .calc-card-header {
    background: var(--navy);
    color: #fff;
    padding: 16px 22px;
    font-size: 15px;
    font-weight: 500;
  }
  .calc-card-sub {
    background: var(--navy-light);
    color: rgba(255,255,255,0.85);
    padding: 9px 22px;
    font-size: 12.5px;
  }
  .calc-section-title {
    background: var(--accent);
    color: #fff;
    padding: 9px 22px;
    font-size: 13px;
    font-weight: 500;
  }
  .calc-row {
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--border);
    padding: 12px 22px;
  }
  .calc-row:last-child { border-bottom: none; }
  .calc-row .label {
    flex: 0 0 220px;
    font-size: 13.5px;
    color: var(--text-primary);
  }
  .calc-row .label.bold { font-weight: 500; }
  .calc-row input[type=number], .calc-row input[type=text] {
    flex: 0 0 180px;
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 8px 12px;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
    background: #fffdf3;
    color: #1a1d24;
  }
  .calc-row input:focus { outline: none; border-color: var(--accent); }
  .calc-row .desc {
    flex: 1;
    font-size: 12px;
    color: var(--text-muted);
    padding-left: 16px;
  }
  .calc-row .value {
    flex: 0 0 180px;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
    text-align: right;
    padding-right: 16px;
    color: var(--text-primary);
  }
  .calc-row.result { background: var(--green-bg); }
  .calc-row.result .label { font-weight: 500; color: var(--green-text); }
  .calc-row.result .value { font-weight: 600; color: var(--green-text); font-size: 16px; }
  .calc-row.total { background: var(--accent-light); }
  .calc-row.total .label { font-weight: 500; }
  .calc-row.total .value { font-weight: 600; }

  .tabs { display: flex; gap: 4px; margin-bottom: 18px; border-bottom: 1px solid var(--border); }
  .tab {
    padding: 10px 18px;
    font-size: 13.5px;
    color: var(--text-secondary);
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .note-box {
    background: var(--accent-light);
    border-radius: 8px;
    padding: 11px 16px;
    font-size: 12px;
    color: var(--navy-light);
    margin-bottom: 16px;
  }
</style>
</head>

let currentCategory = 'all';
let currentTool = null;

function renderNav() {
  const nav = document.getElementById('navSection');
  nav.innerHTML = CATEGORIES.map(cat => {
    const count = cat.id === 'all'
      ? CATEGORIES.reduce((s,c)=>s+(c.id!=='all'?c.tools.length:0),0)
      : cat.tools.length;
    return `<div class="nav-item ${cat.id===currentCategory && !currentTool ? 'active':''}" onclick="selectCategory('${cat.id}')">
      <span class="label">${cat.icon} ${cat.label}</span>
      <span class="count">${count}</span>
    </div>`;
  }).join('');
}

function selectCategory(id) {
  currentCategory = id;
  currentTool = null;
  renderNav();
  renderContent();
}

function openTool(catId, toolId) {
  currentCategory = catId;
  currentTool = toolId;
  renderNav();
  renderContent();
}

function renderContent() {
  const content = document.getElementById('content');
  const title = document.getElementById('pageTitle');
  const crumb = document.getElementById('breadcrumb');

  if (currentTool === 'net2gross') {
    title.textContent = '세전급여 역산 계산기';
    crumb.textContent = '인사/노무 > 세전급여 역산 계산기';
    content.innerHTML = renderNet2GrossTool();
    initNet2Gross();
    return;
  }

  if (currentTool === 'onboarding') {
    title.textContent = '기장거래처 수임 후속절차';
    crumb.textContent = '세무 > 기장거래처 수임 후속절차';
    content.innerHTML = renderOnboardingTool();
    return;
  }

  const cat = CATEGORIES.find(c => c.id === currentCategory);
  title.textContent = cat.label;
  crumb.textContent = currentCategory === 'all' ? '전체 업무 도구' : cat.label + ' 카테고리';

  const tools = currentCategory === 'all'
    ? CATEGORIES.flatMap(c => c.id!=='all' ? c.tools.map(t=>({...t, catId:c.id})) : [])
    : cat.tools.map(t=>({...t, catId:cat.id}));

  if (tools.length === 0) {
    content.innerHTML = `<div class="empty-state">
      <div class="icon">\ud83d\udcc2</div>
      <h3>등록된 도구가 없습니다</h3>
      <p>이 카테고리에는 아직 업무 도구가 추가되지 않았습니다.</p>
    </div>`;
    return;
  }

  content.innerHTML = `<div class="tool-grid">` + tools.map(t => `
    <div class="tool-card" onclick="openTool('${t.catId}','${t.id}')">
      <div class="icon-badge">\ud83d\udcca</div>
      <h3>${t.name}</h3>
      <p>${t.desc}</p>
      <span class="tag">${t.tag}</span>
    </div>
  `).join('') + `</div>`;
}

      <div class="calc-row"><div class="label">① 사업자등록증</div><div class="desc">상호, 사업자등록번호, 대표자, 사업장 주소 확인용</div></div>
      <div class="calc-row"><div class="label">② 대표자 신분증</div><div class="desc">주민등록번호(생년월일 포함) 확인용</div></div>
      <div class="calc-row"><div class="label">③ 연락처(전화번호)</div><div class="desc">신청서 연락처란 기재용</div></div>
      <div class="calc-row"><div class="label">④ 회사(대표자) 도장 이미지</div><div class="desc">국민연금·건강보험 위임장 서명란 삽입용</div></div>
    </div>

    <div class="calc-card">
      <div class="calc-card-header">2단계 · 작성해야 할 위임서류 (3가지)</div>
      <div class="calc-row"><div class="label">1. 홈택스 세무대리정보 이용(해지)신청서</div><div class="desc">신청인 성명 3곳 모두 기재, 서명란은 공란(출력 후 직접 서명)</div></div>
      <div class="calc-row"><div class="label">2. 국민연금 웹EDI 업무대행 신청서</div><div class="desc">사업장관리번호 = 사업자등록번호 + &quot;-0&quot;, 생년월일은 0000.00.00 형식, 거래처 도장 삽입</div></div>
      <div class="calc-row"><div class="label">3. 건강보험 EDI 업무대행 위임장</div><div class="desc">사업장관리번호 = 사업자등록번호 + &quot;-0&quot;, 생년월일은 000000-0****** 형식, 거래처 도장 삽입</div></div>
    </div>

    <div class="calc-card">
      <div class="calc-card-header">작성 규칙 메모</div>
      <div class="calc-row"><div class="label">날짜</div><div class="desc">모든 서류의 날짜는 작업 요청 당일 날짜로 통일 기재</div></div>
      <div class="calc-row"><div class="label">대행기관 정보</div><div class="desc">세무회계 정도 (사업자등록번호 543-11-02777) / 사용자 이지은 고정값</div></div>
      <div class="calc-row"><div class="label">이지은 서명(국민연금 신청서)</div><div class="desc">이지은 도장 이미지를 고정값으로 항상 삽입 (도장.png)</div></div>
      <div class="calc-row"><div class="label">도장 배치</div><div class="desc">본문과의 배치 &quot;글 앞으로&quot;, (서명 또는 인) 문구 위에 겹치도록 배치하고 신청인 2인의 도장은 간격을 두어 겹치지 않게 조정</div></div>
      <div class="calc-row"><div class="label">법인 여부</div><div class="desc">법인이 아닌 경우 위탁사업장의 법인등록번호는 공란 처리</div></div>
      <div class="calc-row result"><div class="label">출력 형식</div><div class="desc">PDF / JPG / PNG 중 택 1로 산출</div></div>

}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'tab-'+name));
}

function fmt(n) {
  if (n === null || n === undefined || isNaN(n)) return '-';
  return Math.round(n).toLocaleString('ko-KR') + '원';
}

function floor10(n) { return Math.floor(n/10)*10; }
function ceil10(n) { return Math.ceil(n/10)*10; }

function getIncomeTax(taxable, famIdx) {
  const kw = taxable / 1000;
  let tax = 0;
  for (const row of TAX_TABLE) {
    if (row[0] <= kw) tax = row[famIdx];
    else break;
  }
  return floor10(tax);
}

function calcInsurance(gross, nonex) {
  const tx = Math.max(gross - nonex, 0);
  const np = floor10(Math.min(tx, 6170000) * 0.045);
  const hi = floor10(tx * 0.03545);
  const li = floor10(hi * 0.1295);
  const ei = floor10(tx * 0.009);
  return { np, hi, li, ei, total: np+hi+li+ei };
}

function calcRate() {
  const net = parseFloat(document.getElementById('r_net').value);
  const fam = parseInt(document.getElementById('r_fam').value) || 1;
  const nonex = parseFloat(document.getElementById('r_nonex').value) || 0;
  const rate = (parseFloat(document.getElementById('r_rate').value) || 100) / 100;
  const famIdx = Math.min(Math.max(fam,1),11) + 1;

  if (!net || net <= 0) {
    ['r_np','r_hi','r_li','r_ei','r_it','r_lt','r_total','r_gross','r_check'].forEach(id=>{
      document.getElementById(id).textContent = '-';
    });
    return;
  }

  function totalDeduction(g) {
    const ins = calcInsurance(g, nonex);
    const it = floor10(getIncomeTax(Math.max(g-nonex,0), famIdx) * rate);
    const lt = floor10(it * 0.1);
    return ins.total + it + lt;
  }

  // 6회 수렴
  let G = Math.round(net/0.88);
  for (let i=0; i<6; i++) {
    G = net + totalDeduction(G);
  }
  // 올림 조정 2회
  for (let i=0; i<2; i++) {
    const netFrom = G - totalDeduction(G);
    const shortfall = net - netFrom;
    if (shortfall > 0) G += ceil10(shortfall);
  }

  const ins = calcInsurance(G, nonex);
  const it = floor10(getIncomeTax(Math.max(G-nonex,0), famIdx) * rate);
  const lt = floor10(it * 0.1);
  const total = ins.total + it + lt;
  const check = G - total;

  document.getElementById('r_np').textContent = fmt(ins.np);
  document.getElementById('r_hi').textContent = fmt(ins.hi);
  document.getElementById('r_li').textContent = fmt(ins.li);
  document.getElementById('r_ei').textContent = fmt(ins.ei);
  document.getElementById('r_it').textContent = fmt(it);
  document.getElementById('r_lt').textContent = fmt(lt);
  document.getElementById('r_total').textContent = fmt(total);
  document.getElementById('r_gross').textContent = fmt(G);
  document.getElementById('r_check').textContent = fmt(check);
}

function calcNotice() {
  const net = parseFloat(document.getElementById('n_net').value);
  const fam = parseInt(document.getElementById('n_fam').value) || 1;
  const nonex = parseFloat(document.getElementById('n_nonex').value) || 0;
  const rate = (parseFloat(document.getElementById('n_rate').value) || 100) / 100;
  const famIdx = Math.min(Math.max(fam,1),11) + 1;

  const npF = parseFloat(document.getElementById('n_np').value) || 0;
  const hiF = parseFloat(document.getElementById('n_hi').value) || 0;
  const liF = parseFloat(document.getElementById('n_li').value) || 0;
  const eiF = parseFloat(document.getElementById('n_ei').value) || 0;
  const insFixed = npF + hiF + liF + eiF;

  if (!net || net <= 0) {
    ['n_ins','n_it','n_lt','n_total','n_gross','n_check'].forEach(id=>{
      document.getElementById(id).textContent = '-';
    });
    return;
  }

  function totalDeduction(g) {
    const it = floor10(getIncomeTax(Math.max(g-nonex,0), famIdx) * rate);
    const lt = floor10(it * 0.1);
    return insFixed + it + lt;
  }

  let G = net + insFixed;
  for (let i=0; i<5; i++) {
    G = net + totalDeduction(G);
  }
  for (let i=0; i<2; i++) {
    const netFrom = G - totalDeduction(G);
    const shortfall = net - netFrom;
    if (shortfall > 0) G += ceil10(shortfall);
  }

  const it = floor10(getIncomeTax(Math.max(G-nonex,0), famIdx) * rate);
  const lt = floor10(it * 0.1);
  const total = insFixed + it + lt;
  const check = G - total;

  document.getElementById('n_ins').textContent = fmt(insFixed);
  document.getElementById('n_it').textContent = fmt(it);
  document.getElementById('n_lt').textContent = fmt(lt);
  document.getElementById('n_total').textContent = fmt(total);
  document.getElementById('n_gross').textContent = fmt(G);
  document.getElementById('n_check').textContent = fmt(check);
}

function initNet2Gross() {
  calcRate();
  calcNotice();
}

renderNav();
renderContent();
</script>
