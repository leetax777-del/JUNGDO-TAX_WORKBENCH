<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세무회계 정도 - 업무 워크벤치</title>
<style>
  @font-face {
    font-family: 'Pretendard';
    src: local('Pretendard');
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #16294f;
    --navy-light: #1f3a6e;
    --accent: #2d5ac4;
    --accent-light: #eaf0fb;
    --bg: #f4f5f7;
    --surface: #ffffff;
    --border: #e3e5ea;
    --text-primary: #1a1d24;
    --text-secondary: #6b7280;
    --text-muted: #9ca3af;
    --green-bg: #eaf6ec;
    --green-text: #1e7a34;
    --radius: 10px;
  }
  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    line-height: 1.5;
  }
  .app { display: flex; min-height: 100vh; }

  /* 사이드바 */
  .sidebar {
    width: 260px;
    background: var(--navy);
    color: #fff;
    flex-shrink: 0;
    padding: 24px 0;
    display: flex;
    flex-direction: column;
  }
  .sidebar-logo {
    padding: 20px 24px 24px;
    background: #ffffff;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    margin-bottom: 16px;
  }
  .sidebar-logo img { height: 32px; display: block; }
  .nav-section { padding: 0 12px; margin-bottom: 4px; }
  .nav-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 14px;
    border-radius: 8px;
    color: rgba(255,255,255,0.78);
    font-size: 14px;
    cursor: pointer;
    margin-bottom: 2px;
    transition: background 0.12s, color 0.12s;
  }
  .nav-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .nav-item.active { background: var(--accent); color: #fff; font-weight: 500; }
  .nav-item .label { display: flex; align-items: center; gap: 10px; }
  .nav-item .count {
    font-size: 11px;
    background: rgba(255,255,255,0.15);
    padding: 1px 7px;
    border-radius: 99px;
    color: rgba(255,255,255,0.85);
  }
  .nav-item.active .count { background: rgba(255,255,255,0.25); color: #fff; }
  .sidebar-footer {
    margin-top: auto;
    padding: 16px 24px 0;
    font-size: 11px;
    color: rgba(255,255,255,0.35);
    border-top: 1px solid rgba(255,255,255,0.1);
  }

  /* 메인 영역 */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .topbar h1 { font-size: 18px; font-weight: 500; }
  .topbar .breadcrumb { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .content { flex: 1; padding: 32px; overflow-y: auto; }

  /* 카드 그리드 (도구 목록) */
  .tool-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
  }
  .tool-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    cursor: pointer;
    transition: border-color 0.12s, box-shadow 0.12s;
  }
  .tool-card:hover { border-color: var(--accent); box-shadow: 0 2px 10px rgba(45,90,196,0.08); }
  .tool-card .icon-badge {
    width: 38px; height: 38px;
    background: var(--accent-light);
    color: var(--accent);
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    margin-bottom: 14px;
  }
  .tool-card h3 { font-size: 15px; font-weight: 500; margin-bottom: 6px; }
  .tool-card p { font-size: 13px; color: var(--text-secondary); }
  .tool-card .tag {
    display: inline-block;
    margin-top: 12px;
    font-size: 11px;
    color: var(--text-muted);
    background: var(--bg);
    padding: 3px 9px;
    border-radius: 99px;
  }

  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-muted);
  }
  .empty-state .icon { font-size: 36px; margin-bottom: 12px; opacity: 0.4; }
  .empty-state h3 { font-size: 15px; color: var(--text-secondary); margin-bottom: 4px; font-weight: 500; }
  .empty-state p { font-size: 13px; }

  /* 도구 상세 화면 공통 */
  .tool-detail { max-width: 920px; }
  .back-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--text-secondary);
    cursor: pointer; margin-bottom: 18px;
    border: none; background: none; padding: 0;
  }
  .back-btn:hover { color: var(--accent); }

  /* 계산기 스타일 */
  .calc-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .calc-card-header {
    background: var(--navy);
    color: #fff;
    padding: 16px 22px;
    font-size: 15px;
    font-weight: 500;
  }
  .calc-card-sub {
    background: var(--navy-light);
    color: rgba(255,255,255,0.85);
    padding: 9px 22px;
    font-size: 12.5px;
  }
  .calc-section-title {
    background: var(--accent);
    color: #fff;
    padding: 9px 22px;
    font-size: 13px;
    font-weight: 500;
  }
  .calc-row {
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--border);
    padding: 12px 22px;
  }
  .calc-row:last-child { border-bottom: none; }
  .calc-row .label {
    flex: 0 0 220px;
    font-size: 13.5px;
    color: var(--text-primary);
  }
  .calc-row .label.bold { font-weight: 500; }
  .calc-row input[type=number], .calc-row input[type=text] {
    flex: 0 0 180px;
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 8px 12px;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
    background: #fffdf3;
    color: #1a1d24;
  }
  .calc-row input:focus { outline: none; border-color: var(--accent); }
  .calc-row .desc {
    flex: 1;
    font-size: 12px;
    color: var(--text-muted);
    padding-left: 16px;
  }
  .calc-row .value {
    flex: 0 0 180px;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
    text-align: right;
    padding-right: 16px;
    color: var(--text-primary);
  }
  .calc-row.result { background: var(--green-bg); }
  .calc-row.result .label { font-weight: 500; color: var(--green-text); }
  .calc-row.result .value { font-weight: 600; color: var(--green-text); font-size: 16px; }
  .calc-row.total { background: var(--accent-light); }
  .calc-row.total .label { font-weight: 500; }
  .calc-row.total .value { font-weight: 600; }

  .tabs { display: flex; gap: 4px; margin-bottom: 18px; border-bottom: 1px solid var(--border); }
  .tab {
    padding: 10px 18px;
    font-size: 13.5px;
    color: var(--text-secondary);
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .note-box {
    background: var(--accent-light);
    border-radius: 8px;
    padding: 11px 16px;
    font-size: 12px;
    color: var(--navy-light);
    margin-bottom: 16px;
  }

  /* 서식 다운로드 버튼 */
  .dl-actions { padding: 16px 18px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .dl-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 11px 20px; border: none; border-radius: 8px; cursor: pointer;
    background: var(--accent); color: #fff;
    font-family: inherit; font-size: 14px; font-weight: 500;
    transition: background 0.12s, box-shadow 0.12s;
  }
  .dl-btn:hover { background: #24499f; box-shadow: 0 2px 10px rgba(45,90,196,0.25); }
  .dl-btn:active { background: #1d3c85; }
  .dl-btn svg { width: 17px; height: 17px; }
  .dl-meta { font-size: 12px; color: var(--text-muted); }

  /* ── 국세상담센터 Q&A 색인 ── */
  .nq-wide { max-width:1460px !important; }
  .nq-hb > span { min-width:0; }
  .nq-qt, .nq-at, .nq-lw { overflow-wrap:anywhere; word-break:break-word; }
  .nq-bc, .nq-cr { min-width:0; }
  .nq-wrap { display:flex; flex-direction:column; height:calc(100vh - 205px); min-height:470px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
  .nq-bar { flex:none; display:flex; align-items:center; gap:12px; padding:13px 16px;
    border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .nq-search { flex:1; min-width:200px; position:relative; }
  .nq-search input { width:100%; font-family:inherit; font-size:14.5px; color:var(--text-primary);
    background:var(--bg); border:1.5px solid var(--border); border-radius:8px;
    padding:10px 14px 10px 38px; outline:none; transition:border-color .12s, box-shadow .12s, background .12s; }
  .nq-search input::placeholder { color:var(--text-muted); }
  .nq-search input:focus { background:var(--surface); border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(45,90,196,.12); }
  .nq-search svg { position:absolute; left:13px; top:50%; transform:translateY(-50%);
    color:var(--text-muted); pointer-events:none; }
  .nq-stamp { flex:none; font-size:10.5px; line-height:1.35; text-align:center; color:var(--navy);
    border:1px solid var(--navy); border-radius:3px; padding:3px 8px; }
  .nq-stamp b { display:block; font-size:11.5px; }
  .nq-tips { flex:none; padding:0 16px 11px; font-size:11.5px; color:var(--text-muted);
    display:flex; gap:16px; flex-wrap:wrap; border-bottom:1px solid var(--border); }
  .nq-tips b { color:var(--text-secondary); font-weight:600; }

  .nq-body { flex:1; display:grid; grid-template-columns:270px 1fr; min-height:0; }
  .nq-side { border-right:1px solid var(--border); background:#fafbfc; display:flex;
    flex-direction:column; min-height:0; min-width:0; }
  .nq-sh { flex:none; display:flex; align-items:center; gap:8px; padding:10px 12px 9px;
    border-bottom:1px solid var(--border); }
  .nq-sh .l { font-size:10.5px; font-weight:700; letter-spacing:.13em; color:var(--text-muted); }
  .nq-sh .sp { flex:1; }
  .nq-tgl { font-family:inherit; font-size:11px; font-weight:600; color:var(--text-muted);
    background:var(--surface); border:1px solid var(--border); border-radius:4px;
    padding:3px 7px; cursor:pointer; white-space:nowrap; }
  .nq-tgl:hover { border-color:var(--accent); color:var(--accent); }
  .nq-tgl[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .nq-tree { flex:1; overflow-y:auto; overflow-x:hidden; padding:5px 0 24px; overscroll-behavior:contain; }

  .nq-nd { display:flex; align-items:baseline; gap:6px; width:100%; text-align:left; background:none;
    border:none; font-family:inherit; cursor:pointer; color:var(--text-secondary);
    padding:5px 11px 5px 7px; line-height:1.4; }
  .nq-nd:hover { background:var(--accent-light); }
  .nq-nd .cv { flex:none; width:11px; font-size:8px; color:var(--text-muted); text-align:center;
    transition:transform .13s; }
  .nq-nd.op > .cv { transform:rotate(90deg); }
  .nq-nd .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nq-nd .n { flex:none; font-size:10px; color:var(--text-muted); font-variant-numeric:tabular-nums; }
  .nq-nd.on { background:var(--accent-light); color:var(--navy); font-weight:700; }
  .nq-nd.on .n { color:var(--accent); }
  .nq-nd.zero { opacity:.33; }
  .nq-l0 { font-size:10.5px; font-weight:700; letter-spacing:.11em; color:var(--text-muted);
    padding:13px 11px 5px 7px; cursor:default; }
  .nq-l0:hover { background:none; }
  .nq-l1 { font-size:13.5px; font-weight:600; color:var(--text-primary); }
  .nq-l2 { font-size:12.5px; padding-left:25px; }
  .nq-l3 { font-size:12px; color:var(--text-muted); padding-left:42px; }

  .nq-main { display:flex; flex-direction:column; min-height:0; min-width:0; background:var(--surface); }
  .nq-mh { flex:none; display:flex; align-items:center; gap:10px; padding:10px 16px;
    border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .nq-bc { display:flex; align-items:center; gap:6px; font-size:12.5px; flex-wrap:wrap; min-width:0; }
  .nq-bc .x { display:inline-flex; align-items:center; gap:5px; background:var(--accent-light);
    color:var(--navy); border:1px solid #cddcf3; border-radius:20px; padding:2px 5px 2px 10px;
    font-weight:600; font-size:12px; }
  .nq-bc .x button { font-family:inherit; border:none; background:none; color:var(--accent);
    cursor:pointer; font-size:13px; line-height:1; padding:2px 3px; border-radius:50%; }
  .nq-bc .x button:hover { background:#cddcf3; }
  .nq-bc .all { color:var(--text-muted); }
  .nq-mh .sp { flex:1; }
  .nq-cnt { font-size:12.5px; color:var(--text-secondary); white-space:nowrap;
    font-variant-numeric:tabular-nums; }
  .nq-cnt b { font-size:15px; color:var(--accent); font-weight:700; }
  .nq-mini { font-family:inherit; font-size:11.5px; font-weight:600; color:var(--text-muted);
    background:var(--surface); border:1px solid var(--border); border-radius:4px;
    padding:4px 9px; cursor:pointer; white-space:nowrap; }
  .nq-mini:hover { border-color:var(--accent); color:var(--accent); }
  .nq-list { flex:1; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; }

  .nq-it { border-bottom:1px solid #f0f2f5; }
  .nq-it.open { background:#fafbfc; }
  .nq-hb { display:grid; grid-template-columns:48px 1fr; gap:12px; width:100%; text-align:left;
    background:none; border:none; font-family:inherit; color:inherit; cursor:pointer;
    padding:11px 18px 11px 10px; border-left:3px solid transparent; }
  .nq-hb:hover { background:var(--accent-light); }
  .nq-it.cur .nq-hb { border-left-color:var(--accent); background:var(--accent-light); }
  .nq-no { font-size:10.5px; color:var(--text-muted); text-align:right; padding-top:3px;
    font-variant-numeric:tabular-nums; }
  .nq-tt { display:block; font-size:14.5px; font-weight:600; line-height:1.45; }
  .nq-sn { display:block; font-size:12.5px; color:var(--text-secondary); line-height:1.5;
    margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nq-it.open .nq-sn { display:none; }
  .nq-cr { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:6px;
    font-size:11px; color:var(--text-muted); }
  .nq-cr .tg { font-weight:700; color:var(--accent); background:var(--accent-light);
    border-radius:3px; padding:1px 6px; }
  .nq-cr .tg.b { color:#8a5a12; background:#fdf2dc; }
  .nq-cr .lw { margin-left:auto; font-size:9.5px; color:var(--text-muted);
    border:1px solid var(--border); border-radius:2px; padding:0 4px; }

  .nq-bd { padding:0 22px 18px 73px; }
  .nq-fl { font-size:10px; font-weight:700; letter-spacing:.14em; color:var(--text-muted); margin:0 0 6px; }
  .nq-qt { margin:0 0 16px; white-space:pre-wrap; font-size:14px; line-height:1.65;
    border-left:2px solid var(--border); padding-left:12px; }
  .nq-at { margin:0 0 16px; white-space:pre-wrap; font-size:14.5px; line-height:1.75; }
  .nq-lw { margin:0; white-space:pre-wrap; font-size:12px; line-height:1.6; color:var(--text-secondary);
    background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:9px 12px; }
  .nq-acts { display:flex; gap:8px; margin-top:14px; }
  .nq-act { font-family:inherit; font-size:12px; font-weight:600; color:var(--text-secondary);
    background:var(--surface); border:1px solid var(--border); border-radius:6px;
    padding:5px 11px; cursor:pointer; }
  .nq-act:hover { border-color:var(--accent); color:var(--accent); }
  .nq-act.done { color:var(--green-text); border-color:var(--green-text); }
  .nq-list mark { background:#ffe082; color:inherit; padding:.04em .12em; border-radius:2px;
    -webkit-box-decoration-break:clone; box-decoration-break:clone; }

  .nq-more { display:block; width:100%; padding:12px; font-family:inherit; font-size:13px;
    font-weight:600; color:var(--text-secondary); background:#fafbfc; border:none;
    border-bottom:1px solid #f0f2f5; cursor:pointer; }
  .nq-more:hover { background:var(--accent-light); color:var(--accent); }
  .nq-msg { padding:56px 24px; text-align:center; }
  .nq-msg h3 { font-size:16px; font-weight:600; margin:0 0 7px; }
  .nq-msg p { margin:0; font-size:13px; color:var(--text-muted); line-height:1.65; }

  @media (max-width:900px) {
    .nq-wrap { height:auto; }
    .nq-body { grid-template-columns:1fr; }
    .nq-side { border-right:none; border-bottom:1px solid var(--border); }
    .nq-tree { max-height:230px; }
    .nq-list { max-height:520px; }
    .nq-bd { padding:0 14px 16px 14px; }
  }

  /* ===== 소득자별 PDF 분할 ===== */
  .ps-drop { display:block; margin:18px 22px; border:1.5px dashed #b9c3d6; border-radius:10px; background:#fafbfc;
    padding:34px 20px; text-align:center; cursor:pointer; transition:border-color .15s, background .15s; }
  .ps-drop:hover, .ps-drop.on { border-color:var(--accent); background:var(--accent-light); }
  .ps-drop strong { display:block; font-size:14.5px; font-weight:600; color:var(--navy); margin-bottom:5px; }
  .ps-drop span { font-size:12.5px; color:var(--text-muted); }
  .ps-drop input { display:none; }
  .ps-bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:14px 22px; border-bottom:1px solid var(--border); }
  .ps-stat { margin-right:auto; font-size:13px; color:var(--text-secondary); }
  .ps-stat b { color:var(--text-primary); font-weight:600; }
  .ps-stat .w { color:#b5532a; font-weight:600; }
  .ps-btn { font-family:inherit; font-size:13px; font-weight:500; border:1px solid var(--border); background:var(--surface);
    color:var(--text-primary); border-radius:7px; padding:8px 14px; cursor:pointer; }
  .ps-btn:hover { border-color:var(--accent); color:var(--accent); }
  .ps-tw { overflow-x:auto; }
  .ps-table { width:100%; border-collapse:collapse; font-size:13px; min-width:640px; }
  .ps-table th { text-align:left; font-weight:500; font-size:12px; color:var(--text-secondary); background:#fafbfc;
    padding:9px 14px; border-bottom:1px solid var(--border); white-space:nowrap; }
  .ps-table td { padding:7px 14px; border-bottom:1px solid #f0f2f5; vertical-align:middle; }
  .ps-table tr:last-child td { border-bottom:none; }
  .ps-table tr.bad td { background:#fdf4ef; }
  .ps-table td.src { color:var(--text-muted); font-size:12px; max-width:170px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ps-table td.num { color:var(--text-muted); font-variant-numeric:tabular-nums; }
  .ps-table input { width:100%; font-family:inherit; font-size:13px; border:1px solid var(--border); border-radius:6px; padding:6px 9px; }
  .ps-table input:focus { outline:none; border-color:var(--accent); }
  .ps-tag { display:inline-block; font-size:11px; font-weight:600; padding:3px 8px; border-radius:20px; white-space:nowrap; }
  .ps-tag.ok { background:var(--green-bg); color:var(--green-text); }
  .ps-tag.no { background:#fbe7dc; color:#b5532a; }
  .ps-msg { padding:0 22px 14px; font-size:12.5px; color:var(--text-muted); }
  .ps-msg:empty { display:none; }
  .ps-hide { display:none !important; }
  /* 청년일자리도약장려금 참여요건 검토 */
  .lp-body { padding:18px 22px; }
  .lp-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px 18px; }
  .lp-f label { display:block; font-size:12.5px; font-weight:600; color:var(--text-secondary); margin-bottom:5px; }
  .lp-f input, .lp-f select { width:100%; font-family:inherit; font-size:14px; color:var(--text-primary); border:1px solid var(--border);
    border-radius:7px; padding:8px 11px; background:var(--surface); }
  .lp-f input:focus, .lp-f select:focus { outline:none; border-color:var(--accent); }
  .lp-hint { font-size:11.5px; color:var(--text-muted); margin-top:4px; line-height:1.45; }
  .lp-hint.ok { color:var(--green-text); } .lp-hint.bad { color:#b5532a; }
  .lp-wide { grid-column:1 / -1; }
  .lp-checks { display:grid; gap:7px; margin-top:16px; padding-top:14px; border-top:1px solid var(--border); }
  .lp-checks label { display:flex; gap:8px; align-items:flex-start; font-size:13px; color:var(--text-primary); cursor:pointer; }
  .lp-checks input { margin-top:3px; accent-color:var(--accent); }
  .lp-actions { display:flex; gap:10px; align-items:center; margin-top:16px; }
  .lp-err { font-size:12.5px; color:#b5532a; }
  .lp-verdict { display:flex; gap:14px; align-items:flex-start; border-radius:12px; padding:16px 22px; margin-bottom:20px; border:1px solid; }
  .lp-verdict .t { font-size:17px; font-weight:700; white-space:nowrap; }
  .lp-verdict .w { font-size:13.5px; color:var(--text-primary); padding-top:2px; }
  .lp-verdict.ok { background:var(--green-bg); border-color:#bfe0c6; color:var(--green-text); }
  .lp-verdict.no { background:#fdf0ee; border-color:#f1c8c2; color:#b3261e; }
  .lp-verdict.warn { background:#fff6e2; border-color:#efd9a3; color:#8a5a00; }
  .lp-table { width:100%; border-collapse:collapse; font-size:13px; }
  .lp-table th { text-align:left; font-weight:500; font-size:12px; color:var(--text-secondary); background:#fafbfc;
    padding:9px 14px; border-bottom:1px solid var(--border); white-space:nowrap; }
  .lp-table td { padding:9px 14px; border-bottom:1px solid #f0f2f5; vertical-align:top; }
  .lp-table tr:last-child td { border-bottom:none; }
  .lp-table td.st { white-space:nowrap; font-weight:600; }
  .lp-table tr.cur td { background:var(--accent-light); }
  .lp-ok { color:var(--green-text); } .lp-no { color:#b3261e; } .lp-warn { color:#8a5a00; } .lp-na { color:var(--text-muted); }
  .lp-kv { display:grid; grid-template-columns:150px 1fr; gap:7px 14px; font-size:13.5px; }
  .lp-kv dt { color:var(--text-secondary); font-weight:500; }
  .lp-todo { padding-left:18px; font-size:13px; color:var(--text-primary); }
  .lp-todo li { margin:4px 0; }
  .lp-hide { display:none; }
</style>
</head>

let currentCategory = 'all';
let currentTool = null;

function renderNav() {
  const nav = document.getElementById('navSection');
  nav.innerHTML = CATEGORIES.map(cat => {
    const count = cat.id === 'all'
      ? CATEGORIES.reduce((s,c)=>s+(c.id!=='all'?c.tools.length:0),0)
      : cat.tools.length;
    return `<div class="nav-item ${cat.id===currentCategory && !currentTool ? 'active':''}" onclick="selectCategory('${cat.id}')">
      <span class="label">${cat.icon} ${cat.label}</span>
      <span class="count">${count}</span>
    </div>`;
  }).join('');
}

function selectCategory(id) {
  currentCategory = id;
  currentTool = null;
  renderNav();
  renderContent();
}

function openTool(catId, toolId) {
  currentCategory = catId;
  currentTool = toolId;
  renderNav();
  renderContent();
}

function renderContent() {
  const content = document.getElementById('content');
  const title = document.getElementById('pageTitle');
  const crumb = document.getElementById('breadcrumb');

  if (currentTool === 'net2gross') {
    title.textContent = '세전급여 역산 계산기';
    crumb.textContent = '인사/노무/급여 > 세전급여 역산 계산기';
    content.innerHTML = renderNet2GrossTool();
    initNet2Gross();
    return;
  }

  if (currentTool === 'ntsqa') {
    title.textContent = '국세상담센터 Q&A 색인';
    crumb.textContent = '세무 > 국세상담센터 Q&A 색인';
    content.innerHTML = renderNtsQaTool();
    initNtsQa();
    return;
  }

  if (currentTool === 'pdfsplit') {
    title.textContent = '소득자별 PDF 분할';
    crumb.textContent = '인사/노무/급여 > 소득자별 PDF 분할';
    content.innerHTML = renderPdfSplitTool();
    initPdfSplit();
    return;
  }

  if (currentTool === 'leapcheck') {
    title.textContent = '청년일자리도약장려금 참여요건 검토';
    crumb.textContent = '인사/노무/급여 > 청년일자리도약장려금 참여요건 검토';
    content.innerHTML = renderLeapTool();
    initLeap();
    return;
  }

  if (currentTool === 'onboarding') {
    title.textContent = '기장거래처 수임 후속절차';
    crumb.textContent = '세무 > 기장거래처 수임 후속절차';
    content.innerHTML = renderOnboardingTool();
    return;
  }

  const cat = CATEGORIES.find(c => c.id === currentCategory);
  title.textContent = cat.label;
  crumb.textContent = currentCategory === 'all' ? '전체 업무 도구' : cat.label + ' 카테고리';

  const tools = currentCategory === 'all'
    ? CATEGORIES.flatMap(c => c.id!=='all' ? c.tools.map(t=>({...t, catId:c.id})) : [])
    : cat.tools.map(t=>({...t, catId:cat.id}));

  if (tools.length === 0) {
    content.innerHTML = `<div class="empty-state">
      <div class="icon">\ud83d\udcc2</div>
      <h3>등록된 도구가 없습니다</h3>
      <p>이 카테고리에는 아직 업무 도구가 추가되지 않았습니다.</p>
    </div>`;
    return;
  }

  content.innerHTML = `<div class="tool-grid">` + tools.map(t => `
    <div class="tool-card" onclick="openTool('${t.catId}','${t.id}')">
      <div class="icon-badge">\ud83d\udcca</div>
      <h3>${t.name}</h3>
      <p>${t.desc}</p>
      <span class="tag">${t.tag}</span>
    </div>
  `).join('') + `</div>`;
}

function fmt(n) {
  if (n === null || n === undefined || isNaN(n)) return '-';
  return Math.round(n).toLocaleString('ko-KR') + '원';
}

function floor10(n) { return Math.floor(n/10)*10; }
function ceil10(n) { return Math.ceil(n/10)*10; }

function getIncomeTax(taxable, famIdx) {
  const kw = taxable / 1000;
  let tax = 0;
  for (const row of TAX_TABLE) {
    if (row[0] <= kw) tax = row[famIdx];
    else break;
  }
  return floor10(tax);
}

function calcInsurance(gross, nonex, isCeo=false) {
  const tx = Math.max(gross - nonex, 0);
  const std = Math.floor(Math.min(tx, 6170000) / 1000) * 1000;
  const np = floor10(std * 0.0475);
  const hi = floor10(tx * 0.03595);
  const li = floor10(hi * 0.1314);
  const ei = isCeo ? 0 : floor10(tx * 0.009);
  return { np, hi, li, ei, total: np+hi+li+ei };
}

function calcRate() {
  const net = parseFloat(document.getElementById('r_net').value);
  const fam = parseInt(document.getElementById('r_fam').value) || 1;
  const nonex = parseFloat(document.getElementById('r_nonex').value) || 0;
  const rate = (parseFloat(document.getElementById('r_rate').value) || 100) / 100;
  const isCeo = document.getElementById('r_ceo') ? document.getElementById('r_ceo').checked : false;
  const famIdx = Math.min(Math.max(fam,1),11) + 1;

  if (!net || net <= 0) {
    ['r_np','r_hi','r_li','r_ei','r_it','r_lt','r_total','r_gross','r_check'].forEach(id=>{
      document.getElementById(id).textContent = '-';
    });
    return;
  }

  function totalDeduction(g) {
    const ins = calcInsurance(g, nonex, isCeo);
    const it = floor10(getIncomeTax(Math.max(g-nonex,0), famIdx) * rate);
    const lt = floor10(it * 0.1);
    return ins.total + it + lt;
  }

  // 6회 수렴
  let G = Math.round(net/0.88);
  for (let i=0; i<6; i++) {
    G = net + totalDeduction(G);
  }
  // 올림 조정 2회
  for (let i=0; i<2; i++) {
    const netFrom = G - totalDeduction(G);
    const shortfall = net - netFrom;
    if (shortfall > 0) G += ceil10(shortfall);
  }

  const ins = calcInsurance(G, nonex, isCeo);
  const it = floor10(getIncomeTax(Math.max(G-nonex,0), famIdx) * rate);
  const lt = floor10(it * 0.1);
  const total = ins.total + it + lt;
  const check = G - total;

  document.getElementById('r_np').textContent = fmt(ins.np);
  document.getElementById('r_hi').textContent = fmt(ins.hi);
  document.getElementById('r_li').textContent = fmt(ins.li);
  document.getElementById('r_ei').textContent = isCeo ? '0원 (대표자 제외)' : fmt(ins.ei);
  document.getElementById('r_it').textContent = fmt(it);
  document.getElementById('r_lt').textContent = fmt(lt);
  document.getElementById('r_total').textContent = fmt(total);
  document.getElementById('r_gross').textContent = fmt(G);
  document.getElementById('r_check').textContent = fmt(check);
}

function calcNotice() {
  const net = parseFloat(document.getElementById('n_net').value);
  const fam = parseInt(document.getElementById('n_fam').value) || 1;
  const nonex = parseFloat(document.getElementById('n_nonex').value) || 0;
  const rate = (parseFloat(document.getElementById('n_rate').value) || 100) / 100;
  const famIdx = Math.min(Math.max(fam,1),11) + 1;

  const npF = parseFloat(document.getElementById('n_np').value) || 0;
  const hiF = parseFloat(document.getElementById('n_hi').value) || 0;
  const liF = parseFloat(document.getElementById('n_li').value) || 0;
  const eiF = parseFloat(document.getElementById('n_ei').value) || 0;
  const insFixed = npF + hiF + liF + eiF;

  if (!net || net <= 0) {
    ['n_ins','n_it','n_lt','n_total','n_gross','n_check'].forEach(id=>{
      document.getElementById(id).textContent = '-';
    });
    return;
  }

  function totalDeduction(g) {
    const it = floor10(getIncomeTax(Math.max(g-nonex,0), famIdx) * rate);
    const lt = floor10(it * 0.1);
    return insFixed + it + lt;
  }

  let G = net + insFixed;
  for (let i=0; i<5; i++) {
    G = net + totalDeduction(G);
  }
  for (let i=0; i<2; i++) {
    const netFrom = G - totalDeduction(G);
    const shortfall = net - netFrom;
    if (shortfall > 0) G += ceil10(shortfall);
  }

  const it = floor10(getIncomeTax(Math.max(G-nonex,0), famIdx) * rate);
  const lt = floor10(it * 0.1);
  const total = insFixed + it + lt;
  const check = G - total;

  document.getElementById('n_ins').textContent = fmt(insFixed);
  document.getElementById('n_it').textContent = fmt(it);
  document.getElementById('n_lt').textContent = fmt(lt);
  document.getElementById('n_total').textContent = fmt(total);
  document.getElementById('n_gross').textContent = fmt(G);
  document.getElementById('n_check').textContent = fmt(check);
}

function dlSuimXlsx() {
  try {
    const bin = atob(SUIM_XLSX_B64);
    const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '4대보험_수임신청서_통합서식.xlsx';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  } catch (e) {
    alert('다운로드에 실패했습니다: ' + e.message);
  }
}

function nqBoot() {
  const D = window.NTS_QA;
  NQ.D = D;
  const R = D.r, N = R.length;
  if (!NQ.TXT) {
    NQ.TXT = new Array(N); NQ.TTL = new Array(N);
    for (let i = 0; i < N; i++) {
      const r = R[i], h = r[5] + ' ' + r[6];
      NQ.TTL[i] = h.toLowerCase();
      NQ.TXT[i] = (h + ' ' + r[7] + ' ' + r[8] + ' ' + (r[2] >= 0 ? D.s[r[2]] : '') + ' ' +
        (r[3] >= 0 ? D.c[r[3]] : '') + ' ' + (r[4] >= 0 ? D.m[r[4]] : '')).toLowerCase();
    }
    const a = {}, b = {}, cc = {};
    for (let i = 0; i < N; i++) {
      const r = R[i];
      (a[r[1]] = a[r[1]] || {})[r[2]] = 1;
      if (r[2] >= 0 && r[3] >= 0) (b[r[2]] = b[r[2]] || {})[r[3]] = 1;
      if (r[2] >= 0 && r[3] >= 0 && r[4] >= 0) (cc[r[2] + '|' + r[3]] = cc[r[2] + '|' + r[3]] || {})[r[4]] = 1;
    }
    const ks = (o, nm) => Object.keys(o || {}).map(Number)
      .sort((x, y) => (nm[x] || '').localeCompare(nm[y] || '', 'ko'));
    Object.keys(a).forEach(g => NQ.TG[g] = ks(a[g], D.s));
    Object.keys(b).forEach(s => NQ.TS[s] = ks(b[s], D.c));
    Object.keys(cc).forEach(k => NQ.TC[k] = ks(cc[k], D.m));
  }
  NQ.st = {q:'',g:-1,s:-1,c:-1,m:-1,shown:NQ.PAGE,cur:-1,only:false};
  NQ.exp = {}; NQ.open = {};
  nqBind();
  nqRun();
}

function nqEsc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function nqRxe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function nqTerms(){return NQ.st.q.trim().toLowerCase().split(/\s+/).filter(Boolean);}
function nqIsCho(t){if(!t.length)return false;for(const ch of t)if(NQ.CHO.indexOf(ch)<0)return false;return true;}
function nqChoMode(t){return t.length>0&&t.every(nqIsCho);}
function nqBuildCho(){
  if (NQ.CHOI) return;
  const R = NQ.D.r; NQ.CHOI = new Array(R.length);
  for (let k = 0; k < R.length; k++) {
    const s = R[k][5] + R[k][6]; let o = '';
    for (let j = 0; j < s.length; j++) {
      const c = s.charCodeAt(j);
      if (c >= 0xAC00 && c <= 0xD7A3) o += NQ.CHO[Math.floor((c - 0xAC00) / 588)];
      else if (c > 32) o += s[j];
    }
    NQ.CHOI[k] = o.toLowerCase();
  }
}

function nqRun() {
  const D = NQ.D, R = D.r, N = R.length, st = NQ.st;
  const t = nqTerms(), cm = nqChoMode(t);
  if (cm) nqBuildCho();
  NQ.cnt = {};
  const add = k => NQ.cnt[k] = (NQ.cnt[k] || 0) + 1;
  const out = [];
  for (let i = 0; i < N; i++) {
    if (t.length) {
      const hay = cm ? NQ.CHOI[i] : NQ.TXT[i];
      let ok = true;
      for (let j = 0; j < t.length; j++) if (hay.indexOf(t[j]) < 0) { ok = false; break; }
      if (!ok) continue;
    }
    const r = R[i];
    add('g' + r[1]);
    if (r[2] >= 0) add('s' + r[2]);
    if (r[2] >= 0 && r[3] >= 0) add('c' + r[2] + '|' + r[3]);
    if (r[2] >= 0 && r[3] >= 0 && r[4] >= 0) add('m' + r[2] + '|' + r[3] + '|' + r[4]);
    if (st.g >= 0 && r[1] !== st.g) continue;
    if (st.s >= 0 && r[2] !== st.s) continue;
    if (st.c >= 0 && r[3] !== st.c) continue;
    if (st.m >= 0 && r[4] !== st.m) continue;
    if (t.length && !cm) {
      let sc = 0;
      for (let j = 0; j < t.length; j++) { const hp = NQ.TTL[i].indexOf(t[j]); sc += hp >= 0 ? (hp === 0 ? 60 : 34) : 8; }
      out.push([i, sc]);
    } else out.push([i, 0]);
  }
  if (t.length && !cm) out.sort((a, b) => b[1] - a[1] || a[0] - b[0]);
  NQ.res = out.map(x => x[0]);
  st.shown = NQ.PAGE; st.cur = -1; NQ.open = {};
  nqPaintTree(); nqPaintHead(); nqPaintList();
}

function nqNode(lv, key, name, n, on, kid, attrs) {
  if (NQ.st.only && !n) return '';
  return '<button class="nq-nd nq-l' + lv + (NQ.exp[key] ? ' op' : '') + (on ? ' on' : '') +
    (n ? '' : ' zero') + '" ' + attrs + '><span class="cv">' + (kid ? '\u25B6' : '') +
    '</span><span class="nm">' + nqEsc(name) + '</span><span class="n">' + (n || 0).toLocaleString() +
    '</span></button>';
}
function nqPaintTree() {
  const D = NQ.D, st = NQ.st; let h = '';
  Object.keys(NQ.TG).map(Number).sort().forEach(g => {
    h += '<div class="nq-nd nq-l0">' + nqEsc(D.g[g]) + '</div>';
    NQ.TG[g].forEach(s => {
      if (s < 0) return;
      h += nqNode(1, 's' + s, D.s[s], NQ.cnt['s' + s] || 0, st.s === s && st.c < 0,
        (NQ.TS[s] || []).length > 0, 'data-s="' + s + '" data-g="' + g + '"');
      if (!NQ.exp['s' + s]) return;
      (NQ.TS[s] || []).forEach(c => {
        const mk = NQ.TC[s + '|' + c] || [];
        h += nqNode(2, 'c' + s + '|' + c, D.c[c], NQ.cnt['c' + s + '|' + c] || 0,
          st.s === s && st.c === c && st.m < 0, mk.length > 0,
          'data-s="' + s + '" data-g="' + g + '" data-c="' + c + '"');
        if (!NQ.exp['c' + s + '|' + c]) return;
        mk.forEach(m => {
          h += nqNode(3, 'm' + s + '|' + c + '|' + m, D.m[m], NQ.cnt['m' + s + '|' + c + '|' + m] || 0,

  document.getElementById('nqTree').innerHTML = h;
}
function nqPaintHead() {
  const D = NQ.D, st = NQ.st;
  const pill = (l, lv) => '<span class="x"><b>' + nqEsc(l) + '</b><button data-clr="' + lv + '" title="해제">\u00D7</button></span>';
  let b = '';
  if (st.g >= 0) b += pill(D.g[st.g], 'g');
  if (st.s >= 0) b += pill(D.s[st.s], 's');

    (nqTerms().length ? ' 검색됨' : '');
}
function nqHl(s) {
  const t = nqTerms(), o = nqEsc(s);
  if (!t.length || nqChoMode(t)) return o;
  return o.replace(new RegExp('(' + t.map(nqRxe).sort((a, b) => b.length - a.length).join('|') + ')', 'gi'), '<mark>$1</mark>');
}
function nqCrumb(r) {
  const D = NQ.D, st = NQ.st;
  let h = '<span class="tg' + (r[1] === 0 ? ' b' : '') + '">' + nqEsc(D.g[r[1]]) + '</span>';
  const p = [];
  if (r[2] >= 0 && st.s < 0) p.push(D.s[r[2]]);

  p.forEach((x, k) => h += (k ? '<span>\u203A</span>' : '') + '<span>' + nqEsc(x) + '</span>');
  if (r[8]) h += '<span class="lw">근거</span>';

}
function nqDetail(r) {
  let h = '<p class="nq-fl">질문</p><p class="nq-qt">' + nqHl(r[6]) + '</p>' +
    '<p class="nq-fl">답변</p><p class="nq-at">' + nqHl(r[7]) + '</p>';
  if (r[8]) h += '<p class="nq-fl">근거법령 · 해석사례</p><p class="nq-lw">' + nqHl(r[8]) + '</p>';
  return h + '<div class="nq-acts"><button class="nq-act" data-cp="a">답변 복사</button>' +
    '<button class="nq-act" data-cp="qa">질문+답변 복사</button></div>';

function nqRows(from, to) {
  const R = NQ.D.r; let h = '';
  for (let k = from; k < to; k++) {
    const i = NQ.res[k], r = R[i], op = NQ.open[i];
    h += '<div class="nq-it' + (op ? ' open' : '') + '" data-k="' + k + '" data-i="' + i + '">' +

      (op ? '<div class="nq-bd">' + nqDetail(r) + '</div>' : '') + '</div>';
  }
  return h;
}
function nqTail() {
  return NQ.res.length > NQ.st.shown
    ? '<button class="nq-more" id="nqMore">다음 ' + Math.min(NQ.PAGE, NQ.res.length - NQ.st.shown).toLocaleString() +
      '건 더 보기 · 남은 ' + (NQ.res.length - NQ.st.shown).toLocaleString() + '건</button>' : '';
}
function nqPaintList() {
  const el = document.getElementById('nqList');
  if (!NQ.res.length) {

function nqRepaintRow(k) {

  if (!el) return;

function nqMarkCur() {
  document.querySelectorAll('.nq-it').forEach(x => x.classList.toggle('cur', +x.dataset.k === NQ.st.cur));
}

function nqBind() {
  const q = document.getElementById('nqQ');
  q.addEventListener('input', () => {
    clearTimeout(NQ.tmr);
    NQ.tmr = setTimeout(() => { NQ.st.q = q.value; nqRun(); }, 90);
  });
  document.getElementById('nqTree').addEventListener('click', e => {
    const b = e.target.closest('.nq-nd');
    if (!b || b.classList.contains('nq-l0')) return;
    const d = b.dataset, st = NQ.st;
    let key, lvl;
    if (d.m !== undefined) { key = 'm' + d.s + '|' + d.c + '|' + d.m; lvl = 3; }
    else if (d.c !== undefined) { key = 'c' + d.s + '|' + d.c; lvl = 2; }
    else { key = 's' + d.s; lvl = 1; }
    const same = (lvl === 1 && st.s === +d.s && st.c < 0) ||
      (lvl === 2 && st.s === +d.s && st.c === +d.c && st.m < 0) ||
      (lvl === 3 && st.s === +d.s && st.c === +d.c && st.m === +d.m);
    if (same) { NQ.exp[key] ? delete NQ.exp[key] : NQ.exp[key] = 1; }
    else {
      st.g = +d.g; st.s = +d.s;
      st.c = lvl >= 2 ? +d.c : -1;
      st.m = lvl >= 3 ? +d.m : -1;
      if (lvl < 3) NQ.exp[key] = 1;
      if (lvl >= 2) NQ.exp['s' + d.s] = 1;
    }
    nqRun();
  });
  document.getElementById('nqBc').addEventListener('click', e => {
    const b = e.target.closest('[data-clr]'); if (!b) return;
    const lv = b.dataset.clr, st = NQ.st;
    if (lv === 'g' || lv === 's') { st.g = -1; st.s = -1; st.c = -1; st.m = -1; }
    if (lv === 'c') { st.c = -1; st.m = -1; }
    if (lv === 'm') { st.m = -1; }
    nqRun();
  });
  document.getElementById('nqList').addEventListener('click', e => {
    const cp = e.target.closest('[data-cp]');
    if (cp) {
      const r = NQ.D.r[+cp.closest('.nq-it').dataset.i];
      const txt = cp.dataset.cp === 'a' ? r[7]
        : '[질문] ' + r[6] + '\n\n[답변] ' + r[7] + (r[8] ? '\n\n[근거] ' + r[8] : '');
      navigator.clipboard.writeText(txt).then(() => {
        const o = cp.textContent;
        cp.textContent = '복사되었습니다'; cp.classList.add('done');
        setTimeout(() => { cp.textContent = o; cp.classList.remove('done'); }, 1400);
      });
      return;
    }
    if (e.target.closest('#nqMore')) {
      const from = NQ.st.shown;
      NQ.st.shown = Math.min(NQ.res.length, NQ.st.shown + NQ.PAGE);
      const m = document.getElementById('nqMore');
      m.insertAdjacentHTML('beforebegin', nqRows(from, NQ.st.shown));
      if (NQ.res.length <= NQ.st.shown) m.remove(); else m.outerHTML = nqTail();
      nqPaintHead();
      return;
    }
    const hb = e.target.closest('.nq-hb'); if (!hb) return;
    const it = hb.closest('.nq-it'), i = +it.dataset.i, k = +it.dataset.k;
    NQ.open[i] ? delete NQ.open[i] : NQ.open[i] = 1;
    NQ.st.cur = k; nqRepaintRow(k); nqMarkCur();
  });
  document.getElementById('nqCollapse').addEventListener('click', () => {
    NQ.open = {}; nqPaintList(); nqMarkCur();
  });
  document.getElementById('nqOnly').addEventListener('click', function () {
    NQ.st.only = !NQ.st.only;
    this.setAttribute('aria-pressed', String(NQ.st.only));
    nqPaintTree();
  });
  if (!window.__nqKeys) {
    window.__nqKeys = 1;
    document.addEventListener('keydown', e => {
      if (currentTool !== 'ntsqa') return;
      const q = document.getElementById('nqQ'); if (!q) return;
      if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); q.select(); return; }
      if (e.key === 'Escape') { q.value = ''; NQ.st.q = ''; nqRun(); q.blur(); return; }
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        const max = Math.min(NQ.st.shown, NQ.res.length) - 1; if (max < 0) return;
        e.preventDefault();
        NQ.st.cur = e.key === 'ArrowDown' ? Math.min(max, NQ.st.cur + 1) : Math.max(0, NQ.st.cur - 1);
        nqMarkCur();
        const el = document.querySelector('.nq-it[data-k="' + NQ.st.cur + '"]');
        if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
        if (document.activeElement === q) q.blur();
        return;
      }
      if (e.key === 'Enter' && NQ.st.cur >= 0 && document.activeElement !== q) {
        const el = document.querySelector('.nq-it[data-k="' + NQ.st.cur + '"]');
        if (el) { e.preventDefault(); const i = +el.dataset.i;
          NQ.open[i] ? delete NQ.open[i] : NQ.open[i] = 1; nqRepaintRow(NQ.st.cur); nqMarkCur(); }
      }
    });
  }
}


/* ===== 소득자별 PDF 분할 ===== */
const PS_LIBS = [
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'
];
// 서식별 성명 추출 규칙 — 새 서식은 여기에 한 줄씩 추가
const PS_NAME_RULES = [
  /⑨\s*성\s*명\s*([가-힣A-Za-z]{2,})/,          // 소득자별소득합계표(사업)
  /소득자[\s\S]{0,60}?성\s*명\s*([가-힣]{2,})/    // 일반 fallback
];
const PS_MONTH_RULE = /(?:^|\s)(\d{4})-(\d{2})\s+\d{4}-\d{2}-\d{2}/gm;  // 귀속년월 + 지급년월일 행
let psRows = [];
let psLibPromise = null;

function psLoadLibs() {
  if (psLibPromise) return psLibPromise;
  psLibPromise = PS_LIBS.reduce((p, src) => p.then(() => new Promise((res, rej) => {
    const el = document.createElement('script');
    el.src = src; el.onload = res; el.onerror = () => rej(new Error('라이브러리 로드 실패: ' + src));
    document.head.appendChild(el);
  })), Promise.resolve()).then(() => {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  });
  psLibPromise.catch(() => { psLibPromise = null; });
  return psLibPromise;
}

function renderPdfSplitTool() {
  return `
  <div class="tool-detail">
    <button class="back-btn" onclick="selectCategory('hr')">\u2190 인사/노무/급여로 돌아가기</button>
    <div class="note-box">여러 쪽짜리 소득자별소득합계표를 한 쪽씩 나눠 <b>성명_귀속연월.pdf</b>로 저장합니다. 파일은 이 브라우저 안에서만 처리되고 외부로 전송되지 않습니다.</div>
    <div class="calc-card">
      <div class="calc-card-header">PDF 올리기</div>
      <div class="calc-card-sub">여러 파일 동시 선택 가능 · 동명이인은 _2, _3 자동 부여 · 성명 미인식 쪽은 ‘확인필요’로 표시</div>
      <label class="ps-drop" id="psDrop">
        <strong>PDF를 끌어다 놓거나 클릭해서 선택</strong>
        <span>소득자별소득합계표(사업) 기준</span>

      </label>
      <div class="ps-msg" id="psMsg"></div>
    </div>
    <div class="calc-card ps-hide" id="psResult">
      <div class="calc-card-header">분할 결과</div>
      <div class="ps-bar">
        <div class="ps-stat" id="psStat"></div>
        <button type="button" class="ps-btn" id="psReset">초기화</button>
        <button type="button" class="dl-btn" id="psZip">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4M4 19h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          ZIP 내려받기
        </button>
      </div>
      <div class="ps-tw">
        <table class="ps-table">
          <thead><tr><th>원본</th><th>쪽</th><th>성명</th><th>귀속연월</th><th style="width:34%">파일명 (수정 가능)</th><th>상태</th></tr></thead>
          <tbody id="psBody"></tbody>
        </table>

// pdf.js가 글자 단위로 쪼개 주는 텍스트를 줄 단위로 재조립
function psToLines(items) {
  const rs = [];
  for (const it of items) {
    if (!it.str) continue;
    const x = it.transform[4], y = it.transform[5];
    let r = rs.find(r => Math.abs(r.y - y) < 2);
    if (!r) { r = { y, a: [] }; rs.push(r); }
    r.a.push({ x, w: it.width || 0, s: it.str });
  }
  rs.sort((a, b) => b.y - a.y);
  return rs.map(r => {
    r.a.sort((p, q) => p.x - q.x);
    let o = '', end = null;
    for (const c of r.a) {
      if (end !== null && c.x - end > 3 && !o.endsWith(' ') && c.s !== ' ') o += ' ';
      o += c.s; end = c.x + c.w;
    }
    return o.replace(/\s+/g, ' ').trim();
  }).join('\n');
}
function psFindName(t) {
  for (const re of PS_NAME_RULES) { const m = t.match(re); if (m) return m[1]; }
  return '';
}
function psFindMonth(t) {
  const ms = [...new Set([...t.matchAll(PS_MONTH_RULE)].map(m => m[1] + m[2]))].sort();
  if (!ms.length) return '';
  return ms.length === 1 ? ms[0] : ms[0] + '-' + ms[ms.length - 1];
}
const psClean = s => s.replace(/[\\/:*?"<>|]/g, '').trim();
const psEsc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

function psAssignNames() {
  const seen = {};
  for (const r of psRows) {
    if (r.edited) continue;
    let base = r.name ? (r.month ? `${r.name}_${r.month}` : r.name)
                      : `확인필요_${r.file.replace(/\.pdf$/i, '')}_p${r.page}`;
    base = psClean(base);
    seen[base] = (seen[base] || 0) + 1;
    r.fname = seen[base] === 1 ? base : `${base}_${seen[base]}`;
  }
}

function psRender() {
  const body = document.getElementById('psBody');
  if (!body) return;
  document.getElementById('psResult').classList.toggle('ps-hide', !psRows.length);
  body.innerHTML = '';
  psRows.forEach(r => {
    const tr = document.createElement('tr');
    if (!r.ok) tr.className = 'bad';
    tr.innerHTML = `<td class="src" title="${psEsc(r.file)}">${psEsc(r.file)}</td><td class="num">${r.page}</td>
      <td>${psEsc(r.name || '—')}</td><td class="num">${r.month || '—'}</td>
      <td><input value="${psEsc(r.fname)}"></td>
      <td><span class="ps-tag ${r.ok ? 'ok' : 'no'}">${r.ok ? '정상' : '확인필요'}</span></td>`;
    tr.querySelector('input').addEventListener('input', e => { r.fname = psClean(e.target.value); r.edited = true; });
    body.appendChild(tr);
  });
  const bad = psRows.filter(r => !r.ok).length;
  document.getElementById('psStat').innerHTML = `총 <b>${psRows.length}</b>쪽` +
    (bad ? ` · <span class="w">확인필요 ${bad}건</span>` : ' · 모두 인식됨');
}

async function psHandle(files) {
  files = [...files].filter(f => f.type === 'application/pdf' || /\.pdf$/i.test(f.name));
  if (!files.length) return;
  const msg = document.getElementById('psMsg');
  msg.textContent = '읽는 중…';
  try {
    await psLoadLibs();
    for (const f of files) {
      const bytes = new Uint8Array(await f.arrayBuffer());
      const doc = await pdfjsLib.getDocument({ data: bytes.slice() }).promise;
      for (let i = 1; i <= doc.numPages; i++) {
        const t = psToLines((await (await doc.getPage(i)).getTextContent()).items);
        const name = psFindName(t), month = psFindMonth(t);
        psRows.push({ file: f.name, bytes, page: i, name, month, ok: !!(name && month) });
      }
    }
    psAssignNames(); psRender();
    msg.textContent = '';
  } catch (e) {
    msg.textContent = '오류: ' + e.message;
  }
}

async function psMakeZip() {
  const btn = document.getElementById('psZip');
  const label = btn.innerHTML;
  btn.disabled = true; btn.lastChild.textContent = ' 만드는 중…';
  try {
    const zip = new JSZip(), cache = new Map(), used = {};
    for (const r of psRows) {
      if (!cache.has(r.bytes)) cache.set(r.bytes, await PDFLib.PDFDocument.load(r.bytes));
      const out = await PDFLib.PDFDocument.create();
      const [pg] = await out.copyPages(cache.get(r.bytes), [r.page - 1]);
      out.addPage(pg);
      let fn = r.fname || `p${r.page}`;
      used[fn] = (used[fn] || 0) + 1;
      if (used[fn] > 1) fn += `_${used[fn]}`;
      zip.file(`${fn}.pdf`, await out.save());
    }
    const months = [...new Set(psRows.map(r => r.month).filter(Boolean))];
    const a = document.createElement('a');
    a.href = URL.createObjectURL(await zip.generateAsync({ type: 'blob' }));
    a.download = `소득자별분할${months.length === 1 ? '_' + months[0] : ''}.zip`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  } catch (e) {
    document.getElementById('psMsg').textContent = '오류: ' + e.message;
  } finally {
    btn.disabled = false; btn.innerHTML = label;
  }
}

function initPdfSplit() {
  const drop = document.getElementById('psDrop'), input = document.getElementById('psFile');
  input.addEventListener('change', e => { psHandle(e.target.files); input.value = ''; });
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('on'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('on'); }));
  drop.addEventListener('drop', e => psHandle(e.dataTransfer.files));
  document.getElementById('psZip').addEventListener('click', psMakeZip);
  document.getElementById('psReset').addEventListener('click', () => { psRows = []; psRender(); });
  psRender();   // 다른 메뉴 갔다 와도 이전 결과 유지
  psLoadLibs().catch(() => {});  // 미리 로드
}


/* ───────── 청년일자리도약장려금 참여요건 검토 ─────────
   기준: 2026년 사업운영 지침(2026.1. 시행본). 자료 파일: leap_data.js */
const LP_SIDO = ['서울특별시','부산광역시','대구광역시','인천광역시','광주광역시','대전광역시','울산광역시','세종특별자치시','경기도','강원특별자치도','충청북도','충청남도','전북특별자치도','전라남도','경상북도','경상남도','제주특별자치도'];
const LP_CAPITAL = ['서울특별시','인천광역시','경기도'];
// 별첨 1: 인구감소지역 분류
const LP_SPECIAL = {
  '강원특별자치도':['양구군','화천군'],
  '충청북도':['괴산군','단양군','보은군','영동군'],
  '충청남도':['부여군','서천군','청양군'],
  '전북특별자치도':['고창군','무주군','부안군','순창군','임실군','장수군','진안군'],
  '전라남도':['강진군','고흥군','곡성군','구례군','보성군','신안군','완도군','장성군','장흥군','함평군','해남군'],
  '경상북도':['봉화군','상주시','영덕군','영양군','의성군','청도군','청송군'],
  '경상남도':['고성군','남해군','의령군','하동군','함양군','합천군']
};
const LP_PREFER = {
  '대구광역시':['군위군'],
  '인천광역시':['강화군','옹진군'],
  '경기도':['가평군','연천군'],
  '강원특별자치도':['고성군','삼척시','양양군','영월군','정선군','철원군','태백시','평창군','홍천군','횡성군'],
  '충청북도':['옥천군','제천시'],
  '충청남도':['공주시','금산군','논산시','보령시','예산군','태안군'],
  '전북특별자치도':['김제시','남원시','정읍시'],
  '전라남도':['담양군','영광군','영암군','진도군','화순군'],
  '경상북도':['고령군','문경시','성주군','안동시','영주시','영천시','울릉군','울진군'],
  '경상남도':['거창군','밀양시','산청군','창녕군','함안군']
};
// 지침 본문에 코드가 명시된 지원제외 업종(소비·향락업). 그 외는 별첨 9로 확인.
const LP_EXCLUDED = {'56211':'일반유흥 주점업','56212':'무도유흥 주점업','56219':'기타 주점업','91249':'기타 사행시설 관리 및 운영업','91291':'무도장 운영업'};

const lpEsc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lpInList = (map, sido, sgg) => (map[sido] || []).find(x => sgg.indexOf(x) !== -1) || null;
const lpPrefix = (list, code) => list.find(x => code.indexOf(x[0]) === 0) || null;
const lpExact = (list, code) => list.find(x => x[0] === code) || null;
function lpAge(birth, on) {
  let a = on.getFullYear() - birth.getFullYear();
  const m = on.getMonth() - birth.getMonth();
  if (m < 0 || (m === 0 && on.getDate() < birth.getDate())) a--;
  return a;
}
function lpDate(v) { if (!v) return null; const a = v.split('-'); return new Date(+a[0], +a[1]-1, +a[2]); }

// 사업자등록증 업종코드(6자리) → 표준산업분류 후보 [[코드, 업종명, 인적용역여부], ...]
function lpResolve(bizCode, DATA) { return (DATA.map && DATA.map[bizCode]) || []; }

// 업종만으로 판정되는 특례(별첨 2·3·4·6)
function lpIndustryHits(code, sido, DATA) {
  const hits = [];
  if (lpPrefix(DATA.a2, code)) hits.push('지식서비스산업');
  if (lpExact(DATA.a3, code)) hits.push('문화콘텐츠산업');
  if (lpExact(DATA.a4, code)) hits.push('신·재생에너지산업');
  if (sido && lpExact(DATA.a6[sido] || [], code)) hits.push('지역주력산업');
  return hits;
}

// inp: {code, sido, sgg, cnt, birth, open, apply, future, crisis, special}
function lpEvaluate(inp, DATA) {
  const r = { rows: [], ex: [], type: {} };
  const sgg = (inp.sgg || '').replace(/\s/g, '');

  // 1. 지원 유형
  const sp = lpInList(LP_SPECIAL, inp.sido, sgg), pf = lpInList(LP_PREFER, inp.sido, sgg);
  const isCapital = LP_CAPITAL.indexOf(inp.sido) !== -1 && !pf;
  r.type.kind = isCapital ? '수도권 유형' : '비수도권 유형';
  if (isCapital) {
    r.type.zone = '해당 없음';
    r.type.note = '수도권 유형은 취업애로청년을 채용한 경우에만 지원합니다.';
  } else if (sp) {
    r.type.zone = '인구감소 특별지원 지역 (' + sp + ')';
    r.type.note = '참여 청년 근속 인센티브 최대 720만원 (6·12·18·24개월 각 180만원)';
  } else if (pf) {
    r.type.zone = '인구감소 우대지원 지역 (' + pf + ')';
    r.type.note = '참여 청년 근속 인센티브 최대 600만원 (6·12·18·24개월 각 150만원)';
  } else {
    r.type.zone = '일반 비수도권 지역';
    r.type.note = '참여 청년 근속 인센티브 최대 480만원 (6·12·18·24개월 각 120만원)';
  }
  if (!sgg) r.type.zone += ' (시·군·구 미입력: 인구감소지역 여부 미판정)';

  // 2. 지원제외 업종
  const exc = LP_EXCLUDED[inp.code];
  r.rows.push(exc
    ? ['지원제외 업종', 'no', '불가', inp.code + ' ' + exc + '은 소비·향락업으로 지원 제외입니다.']
    : ['지원제외 업종', 'ok', '해당 없음', '지침 본문에 명시된 제외 코드가 아닙니다. 청소년유해업소 등은 별첨 9로 별도 확인.']);

  // 3. 규모 요건
  const big = inp.cnt >= 5;
  if (inp.cnt < 1) r.rows.push(['기준 피보험자 수', 'no', '미충족', '1인 이상이어야 합니다. (입력값 ' + inp.cnt + '명)']);
  else if (big) r.rows.push(['기준 피보험자 수', 'ok', '충족', '5인 이상입니다. (입력값 ' + inp.cnt + '명)']);
  else r.rows.push(['기준 피보험자 수', 'warn', '5인 미만', '특례 요건 중 하나에 해당해야 참여할 수 있습니다. (입력값 ' + inp.cnt + '명)']);

  // 4. 5인 미만 특례
  let anyEx = false;
  const ex = (name, ok, txt) => { r.ex.push([name, ok ? 'ok' : 'no', ok ? '해당' : '해당 없음', txt]); if (ok) anyEx = true; };

  const m2 = lpPrefix(DATA.a2, inp.code);
  ex('지식서비스산업 (별첨 2)', !!m2, m2 ? (m2[0] + ' ' + m2[1]) : '별첨 2에 없는 코드입니다.');
  const m3 = lpExact(DATA.a3, inp.code);
  ex('문화콘텐츠산업 (별첨 3)', !!m3, m3 ? (m3[0] + ' ' + m3[1]) : '별첨 3에 없는 코드입니다.');
  const m4 = lpExact(DATA.a4, inp.code);
  ex('신·재생에너지산업 (별첨 4)', !!m4, m4 ? (m4[0] + ' ' + m4[1]) : '별첨 4에 없는 코드입니다. 법령상 관련 업종임을 입증하면 인정될 수 있습니다.');
  ex('미래유망기업 (별첨 5)', !!inp.future, inp.future ? '인증 보유로 입력했습니다. 신청일에 유효한 증빙이 필요합니다.' : '인증 보유로 입력하지 않았습니다.');

  const m6 = lpExact(DATA.a6[inp.sido] || [], inp.code);
  const others = Object.keys(DATA.a6).filter(k => k !== inp.sido && lpExact(DATA.a6[k], inp.code));
  ex('지역주력산업 (별첨 6)', !!m6, m6
    ? (inp.sido + ' 주력산업 목록에 있습니다: ' + m6[0] + ' ' + m6[1])
    : (inp.sido + ' 주력산업 목록에 없는 코드입니다.' + (others.length ? ' (다른 지역 목록에는 있음: ' + others.join(', ') + '. 해당 지역 소재 기업에만 적용)' : '')));

  // 청년 창업기업
  if (!inp.birth || !inp.open) {
    r.ex.push(['청년 창업기업', 'na', '미판정', '대표자 생년월일과 사업개시일을 모두 입력해야 판정합니다.']);
  } else {
    const a1 = lpAge(inp.birth, inp.open);
    const c1 = a1 >= 15 && a1 <= 39;
    const c2 = inp.birth >= new Date(1986, 0, 1);
    const lim = new Date(inp.open.getTime()); lim.setFullYear(lim.getFullYear() + 7);
    const c3 = inp.apply < lim;
    const t = v => v ? '충족' : '미충족';
    ex('청년 창업기업', c1 && c2 && c3,
      '창업일 당시 만 ' + a1 + '세 (' + t(c1) + ': 만 15~39세) · 1986.1.1. 이후 출생 (' + t(c2) + ') · 개시 후 7년 이내 (' + t(c3) + ')');
  }

  ex('고용위기지역 소재 (별첨 7)', !!inp.crisis, inp.crisis ? '고시상 지정 지역으로 입력했습니다.' : '2026.1. 지침에는 지정 지역 목록이 비어 있습니다. 신청일 기준 고시를 확인하십시오.');
  ex('특별고용지원업종 (별첨 8)', !!inp.special, inp.special ? '고시상 지정 업종으로 입력했습니다.' : '2026.1. 지침에는 지정 업종 목록이 비어 있습니다. 신청일 기준 고시를 확인하십시오.');

  r.showEx = !big;

  // 5. 종합
  if (exc) { r.verdict = 'no'; r.why = '지원제외 업종입니다.'; }
  else if (inp.cnt < 1) { r.verdict = 'no'; r.why = '기준 피보험자 수가 1인 미만입니다.'; }
  else if (big) { r.verdict = 'ok'; r.why = '기준 피보험자 수 5인 이상으로 규모 요건을 충족합니다. 아래 별도 확인 항목을 점검하십시오.'; }
  else if (anyEx) {
    r.verdict = 'ok';
    r.why = '5인 미만이지만 특례에 해당합니다: ' + r.ex.filter(x => x[1] === 'ok').map(x => x[0]).join(', ') + '. 아래 별도 확인 항목을 점검하십시오.';
  } else if (r.ex.some(x => x[1] === 'na')) {
    r.verdict = 'warn'; r.why = '5인 미만이고 현재 입력으로는 해당 특례가 없습니다. 청년 창업기업 여부가 미판정입니다.';
  } else { r.verdict = 'no'; r.why = '기준 피보험자 수가 5인 미만이고, 해당하는 특례가 없습니다.'; }
  return r;
}

        <div class="lp-body"><ul class="lp-todo">
          <li>우선지원대상기업 여부 (비수도권은 산업단지 입주 중견기업도 가능)</li>
          <li>연 매출액이 기준 피보험자 수 × 1,900만원 이상인지 (업력 1년 이상 기업만 적용)</li>
          <li>고용보험 신규 성립월에는 신청할 수 없음 (성립 다음 달부터 가능)</li>
          <li>국가·공공기관, 임금체불 명단공개, 중대산업재해 공표, 지원금 부정수급 제한, 고용보험료 체납 등 그 밖의 지원 제외 사유</li>
          <li>채용 청년의 요건 (연령, 정규직 채용, 고용보험 이력 등)</li>
          <li>운영기관 배정 인원 마감 여부와 지침·고시 개정 여부</li>
        </ul></div>
      </div>
    </div>
  </div>`;
}

function initLeap() {
  const $ = id => document.getElementById(id);
  const d = new Date(), p = n => (n < 10 ? '0' : '') + n;
  $('lpApply').value = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  $('lpRun').disabled = true;

  if (window.LEAP_DATA) { lpBoot(); return; }
  const s = document.createElement('script');
  s.src = 'leap_data.js';
  s.onload = () => { if (document.getElementById('lpForm')) lpBoot(); };
  s.onerror = () => {
    const h = document.getElementById('lpBizHint');
    if (!h) return;
    h.className = 'lp-hint bad';
    h.textContent = '자료 파일을 찾을 수 없습니다. index.html과 같은 폴더에 leap_data.js가 있어야 합니다.';
  };
  document.body.appendChild(s);
}

function lpBoot() {
  const $ = id => document.getElementById(id);
  const DATA = window.LEAP_DATA;
  let cands = [];
  $('lpRun').disabled = false;
  $('lpBizHint').textContent = '국세청 업종코드-표준산업분류 연계표(2024년 귀속) 기준으로 변환합니다.';

  const candLabel = c => c[0] + ' ' + c[1] + (c[2] ? ' (인적용역 연계)' : '');
  function onBiz() {
    const v = $('lpBiz').value.trim(), hint = $('lpBizHint'), wrap = $('lpCandWrap');
    cands = [];
    wrap.classList.add('lp-hide');
    hint.className = 'lp-hint';
    if (!/^\d{6}$/.test(v)) { hint.textContent = v ? '업종코드는 숫자 6자리입니다.' : '국세청 업종코드-표준산업분류 연계표(2024년 귀속) 기준으로 변환합니다.'; return; }
    cands = lpResolve(v, DATA);
    if (!cands.length) { hint.className = 'lp-hint bad'; hint.textContent = '연계표에 없는 업종코드입니다. 표준산업분류 코드를 직접 입력하십시오.'; return; }
    $('lpCode').value = cands[0][0];
    if (cands.length === 1) {
      hint.className = 'lp-hint ok';
      hint.textContent = '→ ' + candLabel(cands[0]);
    } else {
      hint.className = 'lp-hint ok';
      hint.textContent = '연계된 표준산업분류 ' + cands.length + '개 중 첫 번째를 넣었습니다. 아래에서 고르십시오.';
      $('lpCand').innerHTML = cands.map((c, i) => `<option value="${i}">${lpEsc(candLabel(c))}</option>`).join('');
      wrap.classList.remove('lp-hide');
    }
  }
  $('lpBiz').addEventListener('input', onBiz);
  $('lpCand').addEventListener('change', e => { const c = cands[+e.target.value]; if (c) $('lpCode').value = c[0]; });

  const row = a => `<tr><td>${lpEsc(a[0])}</td><td class="st lp-${a[1]}">${lpEsc(a[2])}</td><td>${lpEsc(a[3])}</td></tr>`;
  function run() {
    const err = $('lpErr'); err.textContent = '';
    const code = $('lpCode').value.trim(), sido = $('lpSido').value;
    let msg = '';
    if (!/^\d{5}$/.test(code)) msg = '표준산업분류 코드는 숫자 5자리로 입력하십시오.';
    else if (!sido) msg = '시·도를 선택하십시오.';
    else if ($('lpCnt').value === '') msg = '기준 피보험자 수를 입력하십시오.';
    else if (!$('lpApply').value) msg = '참여 신청 예정일을 입력하십시오.';
    if (msg) { err.textContent = msg; $('lpResult').classList.add('lp-hide'); return; }

    const r = lpEvaluate({
      code, sido, sgg: $('lpSgg').value, cnt: parseInt($('lpCnt').value, 10),
      birth: lpDate($('lpBirth').value), open: lpDate($('lpOpen').value), apply: lpDate($('lpApply').value),
      future: $('lpFuture').checked, crisis: $('lpCrisis').checked, special: $('lpSpecial').checked
    }, DATA);

    $('lpVerdict').className = 'lp-verdict ' + r.verdict;
    $('lpVT').textContent = r.verdict === 'ok' ? '참여 가능' : (r.verdict === 'no' ? '참여 불가' : '확인 필요');
    $('lpVW').textContent = r.why;
    $('lpType').innerHTML = `<dt>유형</dt><dd>${lpEsc(r.type.kind)}</dd><dt>인구감소지역 구분</dt><dd>${lpEsc(r.type.zone)}</dd><dt>참고</dt><dd>${lpEsc(r.type.note)}</dd>`;
    $('lpRows').innerHTML = r.rows.map(row).join('');
    $('lpExRows').innerHTML = r.ex.map(row).join('');
    $('lpExCard').classList.toggle('lp-hide', !r.showEx);

    // 같은 업종코드의 다른 연계 분류: 업종만으로 판정되는 특례 비교
    const alt = $('lpAltCard');
    if (cands.length > 1 && cands.some(c => c[0] === code)) {
      $('lpAltRows').innerHTML = cands.map(c => {
        const hits = lpIndustryHits(c[0], sido, DATA);
        return `<tr class="${c[0] === code ? 'cur' : ''}"><td>${lpEsc(c[0])}${c[0] === code ? ' (선택)' : ''}</td><td>${lpEsc(c[1])}</td>` +
               `<td class="st ${hits.length ? 'lp-ok' : 'lp-na'}">${hits.length ? lpEsc(hits.join(', ')) : '없음'}</td></tr>`;
      }).join('');
      alt.classList.remove('lp-hide');
    } else alt.classList.add('lp-hide');

    $('lpResult').classList.remove('lp-hide');
    $('lpVerdict').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  $('lpRun').addEventListener('click', run);
  $('lpReset').addEventListener('click', () => { currentTool = 'leapcheck'; renderContent(); });
  $('lpForm').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') run(); });
  if ($('lpBiz').value) onBiz();
}

</script>
</body>
</html>
